# 트레이드 이론 적중률 실험 - 자동 실행 (마감 모드)
# 이 파일은 저장소의 .github/workflows/tracker.yml 위치에 두세요.

name: 트레이드 이론 기록

on:
  schedule:
    # GitHub 예약 시간은 UTC 기준입니다. 정각은 지연이 잦아서 피했습니다.
    - cron: "17 7 * * 1-5"    # 한국장 마감 후: 한국 시간 평일 16:17
    - cron: "37 21 * * 1-5"   # 미국장 마감 후: 한국 시간 다음 날 06:37 (서머타임 때도 마감 이후)
  workflow_dispatch:          # Actions 탭에서 직접 실행하는 버튼

permissions:
  contents: write             # 결과 파일을 저장소에 저장하기 위한 권한

concurrency:
  group: tracker              # 두 실행이 겹치지 않게
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install yfinance pandas

      - name: 이론 확인 및 기록
        run: python trade_theory_tracker.py --once

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push
