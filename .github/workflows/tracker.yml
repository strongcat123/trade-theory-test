# 트레이드 이론 적중률 실험 - 자동 실행 (마감 모드)
# 이 파일은 저장소의 .github/workflows/tracker.yml 위치에 두세요.

name: 트레이드 이론 기록

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 밀리거나 빠질 수 있어서 매시 17분마다 실행합니다.
    # 프로그램은 이미 기록한 예측을 다시 쓰지 않으므로 여러 번 실행해도 안전합니다.
    - cron: "17 * * * *"
  workflow_dispatch:          # Actions 탭에서 직접 실행하는 버튼

permissions:
  contents: write             # 결과 파일을 저장소에 저장하기 위한 권한

concurrency:
  group: tracker              # 두 실행이 겹치지 않게
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install yfinance pandas

      - name: 이론 확인 및 기록
        run: python trade_theory_tracker.py --once

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push
